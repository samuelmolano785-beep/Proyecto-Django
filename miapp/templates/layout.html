{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
        {%block title%}
        
       {% endblock %}
        ADSO SENA 
    </title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css'%}"/>
</head>
   

<body>

    <!--Cabecera de la pagina-->
    <header>
        <div id="logotipo">
            <!--Logo Django-->
            <img src="{% static 'images/django.png' %}"/>
        <h1>Sitio Web con Django</h1>
        </div>             
    </header>

    <nav>
        <ul>
            <li>
                <a href= "{% url 'inicio' %}">Inicio</a>
            </li>
            <li>
                <a href= "{% url 'hola_mundo' %}">Hola Mundo</a>
            </li>
            <li>
                <a href= "{% url 'pagina' %}">Pagina de pruebas</a>
            </li>
            <li>
                <a href= "{% url 'contacto' %}">Contacto</a>
            </li>
       </ul>
    </nav>  
    <div id="content">
        <div class="box">
            <h1 class="title">Titulo de pruebas</h1>
            {% block content %}
            <!-- codigo que viene de template  -->
            <strong>Contenido del bloque original!!!</strong>
            {% endblock %}

        </div>
       
    </div>
    <hr>
    <footer>
        Curso de Python &copy; ADSO SENA - {% now "d/m/y" %}
    </footer>
</body>
</html>
